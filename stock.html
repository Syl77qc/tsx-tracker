<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TSX Rocket — Fiche titre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0c0f;--bg2:#111318;--bg3:#181c22;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--text:#e8eaf0;--muted:#6b7280;--accent:#f0b429;--accent2:#3ecf8e;--danger:#f87171;--mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;}
  header{border-bottom:1px solid var(--border);padding:1.25rem 2rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:10;background:rgba(10,12,15,0.92);backdrop-filter:blur(12px);}
  .logo{font-family:var(--mono);font-size:1rem;color:var(--accent);text-decoration:none;}
  .logo span{color:var(--muted);}
  nav a{font-family:var(--mono);font-size:0.72rem;color:var(--muted);text-decoration:none;padding:0.35rem 0.75rem;border:1px solid var(--border);border-radius:6px;transition:color 0.15s,border-color 0.15s;}
  nav a:hover{color:var(--accent);border-color:rgba(240,180,41,0.3);}
  .back{margin-left:auto;}
  main{max-width:1100px;margin:0 auto;padding:2rem 2rem;}
  .hero{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:2rem;flex-wrap:wrap;gap:1rem;}
  .hero-left h1{font-family:var(--mono);font-size:1.9rem;font-weight:700;color:var(--accent);margin-bottom:0.2rem;}
  .hero-left h1 span{color:var(--muted);font-size:1rem;}
  .stock-name{color:var(--muted);font-size:0.88rem;margin-bottom:0.5rem;}
  .tags{display:flex;gap:0.5rem;flex-wrap:wrap;}
  .tag{font-family:var(--mono);font-size:0.62rem;padding:3px 8px;border-radius:4px;background:var(--bg3);color:var(--muted);border:1px solid var(--border);}
  .tag.hot{background:rgba(240,180,41,0.12);color:var(--accent);border-color:rgba(240,180,41,0.2);}
  .hero-right{text-align:right;}
  .price-big{font-family:var(--mono);font-size:2.2rem;font-weight:700;color:var(--accent2);}
  .price-change{font-family:var(--mono);font-size:0.82rem;margin-top:2px;}
  .up{color:var(--accent2);} .dn{color:var(--danger);}
  .wl-btn{display:block;margin-top:0.75rem;background:var(--accent);color:#000;border:none;padding:0.55rem 1.1rem;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:0.75rem;font-weight:700;letter-spacing:0.05em;transition:opacity 0.15s;width:100%;text-align:center;}
  .wl-btn:hover{opacity:0.85;}
  .wl-btn.added{background:var(--bg3);color:var(--accent2);border:1px solid var(--accent2);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1rem;}
  @media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr;}}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:1.2rem;}
  .card-title{font-family:var(--mono);font-size:0.62rem;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;margin-bottom:1rem;padding-bottom:0.6rem;border-bottom:1px solid var(--border);}
  .mrow{display:flex;justify-content:space-between;align-items:center;padding:0.45rem 0;border-bottom:1px solid var(--border);font-size:0.8rem;}
  .mrow:last-child{border-bottom:none;}
  .mrow .k{color:var(--muted);}
  .mrow .v{font-family:var(--mono);color:var(--text);}
  .mrow .v.good{color:var(--accent2);}
  .mrow .v.warn{color:var(--accent);}
  .score-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0.75rem 0;}
  .score-circle{width:84px;height:84px;border-radius:50%;border:3px solid var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;margin-bottom:0.6rem;box-shadow:0 0 18px rgba(240,180,41,0.12);}
  .score-num{font-family:var(--mono);font-size:1.5rem;font-weight:700;color:var(--accent);line-height:1;}
  .score-den{font-family:var(--mono);font-size:0.58rem;color:var(--muted);}
  .score-lbl{font-size:0.72rem;color:var(--muted);text-align:center;line-height:1.4;}
  .bar-wrap{margin-bottom:0.65rem;}
  .bar-lbl{display:flex;justify-content:space-between;font-size:0.72rem;margin-bottom:3px;}
  .bar-lbl span:first-child{color:var(--muted);}
  .bar-lbl span:last-child{font-family:var(--mono);color:var(--text);}
  .bar-track{height:5px;background:var(--bg3);border-radius:3px;}
  .bar-fill{height:100%;border-radius:3px;background:var(--accent);}
  .signal-list{display:flex;flex-direction:column;gap:0.45rem;}
  .signal{display:flex;align-items:flex-start;gap:0.65rem;padding:0.55rem 0.7rem;border-radius:8px;background:var(--bg3);font-size:0.8rem;}
  .signal-icon{min-width:20px;font-size:0.95rem;}
  .signal-text{flex:1;color:var(--text);}
  .signal-text small{display:block;color:var(--muted);font-size:0.7rem;margin-top:1px;}
  .years-pills{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
  .year-pill{font-family:var(--mono);font-size:0.62rem;padding:2px 7px;border-radius:4px;background:rgba(240,180,41,0.1);color:var(--accent);}
  .sim-table{width:100%;}
  .sim-table tr{border-bottom:1px solid var(--border);}
  .sim-table tr:last-child{border-bottom:none;}
  .sim-table td{padding:0.45rem 0;font-size:0.8rem;}
  .sim-table td:last-child{text-align:right;font-family:var(--mono);}
  .gain{color:var(--accent2);}
  .loss{color:var(--danger);}
  .chart-wrap{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:1rem;}
  .chart-hdr{padding:0.85rem 1.1rem;border-bottom:1px solid var(--border);font-family:var(--mono);font-size:0.62rem;letter-spacing:0.1em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:0.5rem;}
  @keyframes pulse{0%,100%{opacity:0.3}50%{opacity:1}}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent2);animation:pulse 1.5s infinite;display:inline-block;}
  .disclaimer{margin-top:3rem;padding:1rem 1.1rem;border:1px solid var(--border);border-radius:8px;font-size:0.72rem;color:var(--muted);line-height:1.6;border-left:3px solid var(--danger);}
  .not-found{text-align:center;padding:4rem 2rem;}
  .not-found h2{font-family:var(--mono);color:var(--accent);margin-bottom:1rem;}
  .not-found p{color:var(--muted);}
  .toast{position:fixed;bottom:2rem;right:2rem;z-index:100;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:0.75rem 1.1rem;font-size:0.8rem;font-family:var(--mono);transform:translateY(100px);opacity:0;transition:all 0.3s;pointer-events:none;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.ok{border-left:3px solid var(--accent2);color:var(--accent2);}
  .note-box{background:rgba(240,180,41,0.06);border:1px solid rgba(240,180,41,0.2);border-radius:10px;padding:0.9rem 1.1rem;margin-bottom:1rem;font-size:0.82rem;line-height:1.6;color:var(--text);}
  .note-box strong{color:var(--accent);font-family:var(--mono);font-size:0.75rem;display:block;margin-bottom:0.4rem;}
</style>
</head>
<body>
<header>
  <a class="logo" href="index.html">TSX<span>.</span>ROCKET</a>
  <nav style="display:flex;gap:0.5rem;">
    <a href="index.html">Accueil</a>
    <a href="stats.html">Statistiques</a>
  </nav>
  <a class="back nav" href="index.html">← Retour</a>
</header>

<main id="main">
  <div class="not-found"><h2>Chargement...</h2><p>Récupération des données.</p></div>
</main>

<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script>
const D = window.TSX_DATA;

function toast(msg,type='ok'){const t=document.getElementById('toast');t.textContent=msg;t.className='toast show '+type;setTimeout(()=>t.className='toast',2500);}
function getWL(){try{return JSON.parse(localStorage.getItem('tsx_watchlist')||'[]');}catch{return[];}}
function saveWL(l){localStorage.setItem('tsx_watchlist',JSON.stringify(l));}
function inWL(ticker,exchange){return getWL().some(i=>i.ticker===ticker&&i.exchange===exchange);}
function toggleWL(ticker,exchange,item){
  let l=getWL();
  if(inWL(ticker,exchange)){l=l.filter(i=>!(i.ticker===ticker&&i.exchange===exchange));saveWL(l);updateBtn(false,ticker,exchange,item);toast('Retiré de la watchlist');}
  else{l.push({ticker,exchange,name:item.name,score:item.score,vol:item.vol_spike,sector:item.sector});saveWL(l);updateBtn(true,ticker,exchange,item);toast('Ajouté à ta watchlist ✓');}
}
function updateBtn(inList,ticker,exchange,item){
  const b=document.getElementById('wlBtn');if(!b)return;
  b.textContent=inList?'✓ Dans ma watchlist':'+ Ajouter à ma watchlist';
  b.className='wl-btn'+(inList?' added':'');
  b.onclick=()=>toggleWL(ticker,exchange,item);
}

async function fetchLive(ticker,exchange){
  const suffix=exchange==='V'?'.V':'.TO';
  try{
    const url=`https://query1.finance.yahoo.com/v8/finance/chart/${ticker+suffix}?interval=1d&range=5d`;
    const r=await fetch(`https://corsproxy.io/?${encodeURIComponent(url)}`);
    const d=await r.json();
    const m=d?.chart?.result?.[0]?.meta;
    if(!m)return null;
    return{price:m.regularMarketPrice,prev:m.chartPreviousClose||m.previousClose,high52:m.fiftyTwoWeekHigh,low52:m.fiftyTwoWeekLow,volume:m.regularMarketVolume};
  }catch{return null;}
}

function volSignal(v){
  if(v>=1.2)return{icon:'🔥',label:'Volume en forte hausse',detail:`${v.toFixed(1)}x la moyenne 30j — signal fort d'intérêt`};
  if(v>=1.0)return{icon:'📈',label:'Volume en légère hausse',detail:`${v.toFixed(1)}x la moyenne 30j — intérêt croissant`};
  return{icon:'😴',label:'Volume calme',detail:`${v.toFixed(1)}x la moyenne 30j`};
}

function render(ticker,exchange,item,live){
  const price=live?.price??item.last_close;
  const prev=live?.prev??item.last_close;
  const chg=price-prev, chgPct=prev?(chg/prev*100):0;
  const chgClass=chg>=0?'up':'dn';
  const chgStr=(chg>=0?'+':'')+chg.toFixed(3)+' $ ('+(chgPct>=0?'+':'')+chgPct.toFixed(2)+'%)';
  const inList=inWL(ticker,exchange);
  const vol=volSignal(item.vol_spike);
  const mise=100/price;
  const sd=item.score_details||{patternMatch:70,volMomentum:50,priceStability:65,lowProximity:50};

  document.getElementById('main').innerHTML=`
    <div class="hero">
      <div class="hero-left">
        <h1>${ticker} <span>.${exchange}</span></h1>
        <div class="stock-name">${item.name}</div>
        <div class="tags">
          <span class="tag">${exchange==='V'?'TSXV':'TSX'}</span>
          <span class="tag">${item.sector}</span>
          ${item.score>=70?'<span class="tag hot">Score élevé</span>':''}
          <span class="tag">#${item.rank} top20</span>
        </div>
      </div>
      <div class="hero-right">
        <div class="price-big">${price.toFixed(3)} $</div>
        <div class="price-change ${chgClass}">${chgStr}</div>
        <button class="wl-btn ${inList?'added':''}" id="wlBtn" onclick="toggleWL('${ticker}','${exchange}',TSX_DATA.top20.find(t=>t.ticker==='${ticker}'&&t.exchange==='${exchange}'))">
          ${inList?'✓ Dans ma watchlist':'+ Ajouter à ma watchlist'}
        </button>
      </div>
    </div>

    ${item.notes?`<div class="note-box"><strong>📌 Note analystes / fondamentaux</strong>${item.notes}</div>`:''}

    <div class="chart-wrap">
      <div class="chart-hdr"><span class="dot"></span>Graphique — ${ticker}.${exchange} · TradingView</div>
      <div id="tv_${ticker}"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">Score algorithmique</div>
        <div class="score-wrap">
          <div class="score-circle"><div class="score-num">${item.score.toFixed(0)}</div><div class="score-den">/100</div></div>
          <div class="score-lbl">Ressemblance au profil de<br>2 949 fusées historiques</div>
        </div>
        <div class="bar-wrap"><div class="bar-lbl"><span>Correspondance pattern</span><span>${sd.patternMatch}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${sd.patternMatch}%"></div></div></div>
        <div class="bar-wrap"><div class="bar-lbl"><span>Momentum volume</span><span>${sd.volMomentum}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${sd.volMomentum}%;background:var(--accent2)"></div></div></div>
        <div class="bar-wrap"><div class="bar-lbl"><span>Stabilité du prix</span><span>${sd.priceStability}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${sd.priceStability}%"></div></div></div>
        <div class="bar-wrap"><div class="bar-lbl"><span>Proximité plancher</span><span>${sd.lowProximity}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${sd.lowProximity}%;background:var(--info,#60a5fa)"></div></div></div>
      </div>
      <div class="card">
        <div class="card-title">Signaux pré-lancement</div>
        <div class="signal-list">
          <div class="signal"><div class="signal-icon">${vol.icon}</div><div class="signal-text">${vol.label}<small>${vol.detail}</small></div></div>
          <div class="signal"><div class="signal-icon">${item.price_trend==='up'?'↑':'↓'}</div><div class="signal-text">${item.price_trend==='up'?'Prix en hausse':'Prix en légère baisse'}<small>${item.price_trend==='down'?'Pattern accumulation silencieuse — cohérent avec profil fusée':''}</small></div></div>
          <div class="signal"><div class="signal-icon">📍</div><div class="signal-text">Distance plancher 52s<small>${(item.dist_from_low*100).toFixed(0)}% au-dessus du bas annuel</small></div></div>
          <div class="signal">
            <div class="signal-icon">📅</div>
            <div class="signal-text">Années actives — secteur ${item.sector}
              <small>Jours médian : ${item.days_median}j · Gain médian : +${item.gain_median}%</small>
              <div class="years-pills">${(item.years_active||[]).map(y=>`<span class="year-pill">${y}</span>`).join('')}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="card-title">Données de marché</div>
        <div class="mrow"><span class="k">Prix actuel</span><span class="v good">${price.toFixed(3)} $</span></div>
        <div class="mrow"><span class="k">52s haut</span><span class="v">${live?.high52?live.high52.toFixed(3)+' $':'—'}</span></div>
        <div class="mrow"><span class="k">52s bas</span><span class="v">${live?.low52?live.low52.toFixed(3)+' $':'—'}</span></div>
        <div class="mrow"><span class="k">Volume jour</span><span class="v">${live?.volume?live.volume.toLocaleString('fr-CA'):'—'}</span></div>
        <div class="mrow"><span class="k">Secteur</span><span class="v">${item.sector}</span></div>
        <div class="mrow"><span class="k">Données au</span><span class="v">${item.last_date}</span></div>
        <div class="mrow"><span class="k">Gain médian historique</span><span class="v warn">+${item.gain_median}%</span></div>
        <div class="mrow"><span class="k">Délai médian au pic</span><span class="v">${item.days_median}j (~${Math.round(item.days_median/30)} mois)</span></div>
      </div>
      <div class="card">
        <div class="card-title">Simulation — mise de 100 $</div>
        <table class="sim-table">
          <tr><td style="color:var(--muted);font-size:0.72rem">${Math.floor(mise)} actions à ${price.toFixed(3)}$</td><td></td></tr>
          ${[
            [`Gain médian (+${item.gain_median}%)`, 1+item.gain_median/100],
            ['+300%', 4],['+500%', 6],['+1000%', 11]
          ].map(([lbl,mult])=>`<tr><td>${lbl}</td><td class="gain">→ ${Math.round(mise*price*mult)}$ <span style="color:var(--muted);font-size:0.7rem">(${(price*mult).toFixed(2)}$)</span></td></tr>`).join('')}
          <tr><td style="color:var(--muted)">Si ça va à 0$</td><td class="loss">- 100 $</td></tr>
        </table>
      </div>
    </div>

    <div class="disclaimer">⚠️ Analyse à titre informatif uniquement. Les penny stocks sont des investissements à très haut risque. Ce score est basé sur des patterns historiques statistiques et ne constitue pas un conseil financier. Ne jamais investir plus que ce qu'on est prêt à perdre entièrement.</div>
  `;

  new TradingView.widget({
    width:'100%',height:420,symbol:`TSXV:${ticker}`,
    interval:'D',timezone:'America/Toronto',theme:'dark',style:'1',locale:'fr',
    toolbar_bg:'#111318',enable_publishing:false,allow_symbol_change:false,
    container_id:`tv_${ticker}`,hide_side_toolbar:false,
  });
}

function renderUnknown(ticker,exchange,live){
  const price=live?.price??0;
  document.getElementById('main').innerHTML=`
    <div class="hero">
      <div class="hero-left">
        <h1>${ticker} <span>.${exchange}</span></h1>
        <div class="stock-name">Titre hors top 20 algorithmique</div>
        <div class="tags"><span class="tag">${exchange==='V'?'TSXV':'TSX'}</span></div>
      </div>
      <div class="hero-right">
        <div class="price-big">${price?price.toFixed(3)+' $':'— $'}</div>
        <button class="wl-btn" onclick="toggleWL('${ticker}','${exchange}',{name:'${ticker}',score:0,vol_spike:1,sector:'—'})">+ Ajouter à ma watchlist</button>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="chart-hdr"><span class="dot"></span>Graphique — ${ticker}.${exchange}</div>
      <div id="tv_${ticker}"></div>
    </div>
    <div class="card" style="margin-top:1rem">
      <div class="card-title">Note</div>
      <p style="color:var(--muted);font-size:0.83rem;line-height:1.6">Ce titre n'est pas dans notre top 20 algorithmique actuel.<br>Le graphique et le prix live sont affichés. Pour mettre à jour le classement, relance <code style="color:var(--accent);font-size:0.78rem">tsx_update.py</code>.</p>
    </div>
    <div class="disclaimer" style="margin-top:1rem">⚠️ Analyse à titre informatif uniquement. Investissement à très haut risque.</div>`;
  new TradingView.widget({width:'100%',height:420,symbol:`TSXV:${ticker}`,interval:'D',timezone:'America/Toronto',theme:'dark',style:'1',locale:'fr',toolbar_bg:'#111318',enable_publishing:false,container_id:`tv_${ticker}`});
}

async function init(){
  const p=new URLSearchParams(window.location.search);
  const ticker=(p.get('ticker')||'').toUpperCase();
  const exchange=(p.get('exchange')||'V').toUpperCase();
  if(!ticker){window.location.href='index.html';return;}
  document.title=`${ticker}.${exchange} — TSX Rocket`;
  const item=D.top20.find(t=>t.ticker===ticker&&t.exchange===exchange);
  const live=await fetchLive(ticker,exchange);
  if(item){render(ticker,exchange,item,live);}
  else{renderUnknown(ticker,exchange,live);}
}

window.TSX_DATA=D;
</script>
<script src="https://s3.tradingview.com/tv.js" onload="init()"></script>
</body>
</html>
